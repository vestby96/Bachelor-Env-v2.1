<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap" rel="stylesheet">
    <script type="text/javascript" src="./js/jquery-3.6.4.min.js"></script>
    <script type="text/javascript" src="./js/jquery-ui-1.13.2/jquery-ui.js"></script>
    <script type="text/javascript" src="./js/script.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="./img/favicon/favico_32x32.ico">
    <title>Visualizer</title>
</head>
<body>
    <nav>
        <div id="logo"></div>
        
        <!-- Search button -->
        <div class="button" onkeypress="toggle_search()" onclick="toggle_search()" id="searchToggler" title="Show or hide the search field" tabindex="0">Search<p></p></div>
        
        <!-- Settings button -->
        <div class="button" onkeypress="toggle_settings()" onclick="toggle_settings()" id="settingsToggler" title="Show or hide the settings" tabindex="0">Settings<p id="icon"></p></div>
        
        <!-- Information button -->
        <div class="button" onkeypress="toggle_info()" onclick="toggle_info()" id="infoToggler" title="Show or hide the display legend" tabindex="0">Information<p></p></div>
    </nav>

    <!-- Settings section -->
    <div id="settings">
        <div id="scale">
            <p>Scale the objects</p>
            <input type="range" id="scaleInput" min="0.1" max="10" onchange="change_scale()">
            <div class="button" onkeypress="reset_scale()" onclick="reset_scale()">Reset</div>
        </div>
    </div>

    <!-- Processlist section -->
    <div class="wrapper" id="left">
        <div id="inputDiv" class="hidden">
            <!-- Search input field -->
            <input type="text" id="searchInput" autocomplete="off" onkeyup="search()" placeholder="Search..." title="Search through your processes">
        </div>
    </div>

    <!-- Display section -->
    <div class="wrapper" id="right">
        <!-- Toggle process list button -->
        <div class="button" id="toggleLeftButton" onkeypress="toggle_left()" onclick="toggle_left()" title="Toggle the process list" tabindex="0"><p></p></div>
        <div id="path"></div>
        <h3 id="pageLabel" title="Current Page"></h3>
        <div id="displayParent">
            <div id="display">
                <svg xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- A marker to be used as an arrowhead -->
                        <marker
                        id="arrow"
                        viewBox="0 0 10 10"
                        refX="5"
                        refY="5"
                        markerWidth="6"
                        markerHeight="6"
                        orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" />
                        </marker>
                    </defs>
                </svg>
                <div id="displayCenter"></div>
            </div>
        </div>
    </div>
    
    <!-- Information section -->
    <div id="info" class="hiddenInfo">
        <div id="wrapper" class="hiddenWrapper">
            <div id="container">
                <!-- Detail section for "decision" -->
                <div class="detail" id="decision">
                    <div class="summary">
                        <!-- Icon button for toggling detail view -->
                        <div class="icon button" onkeypress="toggle_detail('decision')" onclick="toggle_detail('decision')"></div>
                        <h3>decision</h3>
                        <div class="stageImage" name="decision"></div>
                    </div>
                    <div class="description">
                        <p>
                            Lorem ipsum dolor sit amet 
                        </p>
                    </div>
                </div>
                
                <!-- Detail section for "anchor" -->
                <div class="detail" id="anchor">
                    <div class="summary">
                        <!-- Icon button for toggling detail view -->
                        <div class="icon button" onkeypress="toggle_detail('anchor')" onclick="toggle_detail('anchor')"></div>
                        <h3>anchor</h3>
                        <div class="stageImage" name="anchor"><p></p></div>
                    </div>
                    <div class="description">
                        <p>
                            Lorem ipsum dolor sit amet 
                        </p>
                    </div>
                </div>
                
                <!-- Detail section for "choice" -->
                <div class="detail" id="choice">
                    <div class="summary">
                        <!-- Icon button for toggling detail view -->
                        <div class="icon button" onkeypress="toggle_detail('choice')" onclick="toggle_detail('choice')"></div>
                        <h3>choice</h3>
                        <div class="stageImage" name="choice">
                            <p></p>
                        </div>
                    </div>
                    <div class="description">
                        <p>
                            Lorem ipsum dolor sit amet 
                        </p>
                    </div>
                </div>
                
                <!-- Detail section for "start" -->
                <div class="detail" id="start">
                    <div class="summary">
                        <!-- Icon button for toggling detail view -->
                        <div class="icon button" onkeypress="toggle_detail('start')" onclick="toggle_detail('start')"></div>
                        <h3>start</h3>
                        <div class="stageImage" name="start">
                            <p></p>
                        </div>
                    </div>
                    <div class="description">
                        <p>
                            Lorem ipsum dolor sit amet 
                        </p>
                    </div>
                </div>
                
                <!-- Detail section for "end" -->
                <div class="detail" id="end">
                    <div class="summary">
                        <!-- Icon button for toggling detail view -->
                        <div class="icon button" onkeypress="toggle_detail('end')" onclick="toggle_detail('end')"></div>
                        <h3>end</h3>
                        <div class="stageImage" name="end">
                            <p></p>
                        </div>
                    </div>
                    <div class="description">
                        <p>
                            Lorem ipsum dolor sit amet 
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
