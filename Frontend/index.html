<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script type="text/javascript" src="./js/script.js"></script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="https://images.squarespace-cdn.com/content/v1/6348175dfb4742355176e669/28f326e8-9879-48c7-bfc9-4f1c03baa1a6/favicon.ico?format=100w">
    <title>Visualizer</title>
</head>
<body>
    <nav>
        <div id="logo"></div>
    </nav>

    <section>
        <div id="margin">
            <div id="marginTop">
                <h3>processes</h3>
                <div onclick="toggle_filter()"></div>
            </div>
            <div id="searchDiv">
                <input id="searchInput" onkeyup="search()" placeholder="Search...">
            </div>
        </div>

        <div id="display">
            <div id="path" class="path"></div>
            <div id="displayProcess">
                <p id="pageLabel"></p>
                <svg xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- A marker to be used as an arrowhead -->
                        <marker
                        id="arrow"
                        viewBox="0 0 10 10"
                        refX="5"
                        refY="5"
                        markerWidth="6"
                        markerHeight="6"
                        orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" />
                        </marker>
                    </defs>
                </svg>
                <div id="displayCenterProcess"></div>
            </div>
        </div>
    </section>
</body>
</html>
